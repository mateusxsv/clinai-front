<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b4b50" />
    <title>Sem conexão · ClinAi</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
        background: #f2f4f3;
        color: #173b3c;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
      }
      main {
        max-width: 420px;
        text-align: center;
      }
      h1 {
        font-size: 1.7rem;
      }
      p {
        line-height: 1.6;
      }
      button {
        font: inherit;
        background: #0b4b50;
        color: #fff;
        border: 0;
        border-radius: 12px;
        padding: 14px 24px;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 3px solid #18b9aa;
        outline-offset: 4px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          background: #101e22;
          color: #eef6f5;
        }
        button {
          background: #14646a;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Você está sem conexão</h1>
      <p>
        Conecte-se à internet para acessar sua conta e consultar os
        atendimentos.
      </p>
      <p>Nenhuma operação será enviada automaticamente.</p>
      <button type="button" onclick="location.reload()">
        Tentar novamente
      </button>
    </main>
  </body>
</html>
